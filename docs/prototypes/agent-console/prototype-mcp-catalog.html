<!doctype html>
<!-- prototype-mcp-catalog.md -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP 管理</title>
<script src="../manifest.js"></script><script src="../app-identity.js"></script>
<link rel="stylesheet" href="../_shared/agent-console.css">
<style>
.amc-actions{display:flex;gap:8px;align-items:center;flex:none}
.amc-body{padding:14px 0 4px}
.amc-sub{display:block;font-size:10px;color:var(--acv-muted);margin-top:3px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amc-mono{font:10px/1.6 ui-monospace,SFMono-Regular,monospace}
.amc-kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 10px;font-size:11px;line-height:1.6}
.amc-kv dt{color:var(--acv-muted)}
.amc-kv dd{margin:0;color:var(--acv-ink);overflow-wrap:anywhere}
.amc-out{margin:8px 0 0;font-size:11px}
.amc-out summary{cursor:pointer;color:var(--acv-muted)}
.amc-out pre{margin:6px 0 0;padding:8px;border-radius:6px;background:var(--acv-soft);font:10px/1.6 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--acv-ink)}
.amc-tools{display:flex;flex-direction:column;gap:6px}
.amc-tool{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 9px;border:1px solid var(--acv-line);border-radius:7px;font-size:11px}
.amc-tool input{margin:2px 0 0}
.amc-tool b{font:600 11px/1.5 ui-monospace,SFMono-Regular,monospace;margin-right:6px}
.amc-tool small{display:block;color:var(--acv-muted);font-size:10px;margin-top:2px;line-height:1.6}
.amc-tool .acv2-badge{margin-right:4px}
.amc-tool .acv2-button{min-height:24px;padding:2px 7px;font-size:10px}
.amc-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.amc-head-row h3{margin:0}
.amc-head-row .acv2-button{min-height:24px;padding:2px 8px;font-size:10px}
.amc-radios{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--acv-ink)}
.amc-radios label{display:flex;gap:5px;align-items:center}
.amc-pairs{width:100%;min-height:54px;resize:vertical;border:1px solid var(--acv-line);border-radius:6px;padding:7px 8px;background:var(--acv-paper);color:var(--acv-ink);font:10.5px/1.6 ui-monospace,SFMono-Regular,monospace}
.amc-pairs:focus-visible{outline:2px solid var(--acv-brand);outline-offset:-2px}
.amc-hint{font-size:10px;color:var(--acv-muted);line-height:1.6}
.amc-import-result{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:11px}
.amc-import-result li{padding:7px 9px;border:1px solid var(--acv-line);border-radius:7px}
.amc-import-result small{display:block;color:var(--acv-muted);font-size:10px;margin-top:2px}
.amc-import-error{margin:8px 0 0;font-size:11px;line-height:1.6;color:var(--acv-warning)}
</style>
</head>
<body>
<div class="acv2-app" data-shared-block="agent-console">
<header class="acv2-header"><div class="acv2-brand">Agent 工作台 <small>工作空间 / MCP 管理</small></div><div class="acv2-local"><span class="acv2-dot"></span>本机工作空间</div></header>
<main class="acv2-main">
<div class="acv2-heading"><div class="acv-tip-row"><h1>MCP 管理</h1><span data-acv-tip="服务器由本机服务连接；执行者只拿到所绑定服务器的 mcp__ 代理工具，拿不到凭证。
· 登记后在团队管理里绑定到执行者能力档，绑定时需要确认。
· 不逐次确认工具调用：新增或变化的工具待复核，需人工确认的工具不提供。"></span></div><div class="amc-actions"><button class="acv2-button" type="button" data-goto="agent-console/team-management" data-goto-href="../agent-console/prototype-team-management.html">返回团队管理</button><button class="acv2-button" type="button" id="amc-import">导入 JSON</button><button class="acv2-button acv2-primary" type="button" id="amc-new">添加服务器</button></div></div>
<div class="acv2-workspace"><section class="acv5-panel"><div class="acv5-panel-head">MCP 服务器<small id="amc-count"></small></div><div class="acv5-scroll"><table class="acv5-table"><thead><tr><th>名称</th><th>连接方式</th><th>状态</th><th>工具</th><th>绑定的能力档</th></tr></thead><tbody id="amc-rows"></tbody></table></div></section>
<aside class="acv2-drawer" id="amc-drawer" aria-label="MCP 服务器" hidden><div class="acv2-drawer-head"><div><div class="acv2-eyebrow" id="amc-kind"></div><h2 id="amc-title"></h2></div><div class="acv2-drawer-actions"><button class="acv3-icon-close" id="amc-close" type="button" aria-label="关闭抽屉"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></div><div class="acv2-drawer-scroll"><div class="amc-body" id="amc-body"></div></div></aside><div class="acv2-mask"></div></div>
</main></div>
<div data-demo-harness><span class="dh-tag">Demo ·</span><div class="dh-group"><span class="dh-title">本机登录</span><div class="dh-opts"><button type="button" class="dh-opt" data-acv-auth="ok" aria-pressed="true">已授权</button><button type="button" class="dh-opt" data-acv-auth="none" aria-pressed="false">未登录</button><button type="button" class="dh-opt" data-acv-auth="expired" aria-pressed="false">链接已失效</button></div></div><div class="dh-group"><span class="dh-title">服务器列表</span><div class="dh-opts"><button type="button" class="dh-opt" data-amc-list="sample" aria-pressed="true">示例数据</button><button type="button" class="dh-opt" data-amc-list="empty" aria-pressed="false">空</button></div></div><div class="dh-group" id="amc-check-group" hidden><span class="dh-title">检查结果</span><div class="dh-opts"><button type="button" class="dh-opt" data-amc-check="several" aria-pressed="true">多个服务器</button><button type="button" class="dh-opt" data-amc-check="single" aria-pressed="false">单个服务器</button><button type="button" class="dh-opt" data-amc-check="notJson" aria-pressed="false">不是 JSON</button><button type="button" class="dh-opt" data-amc-check="noServers" aria-pressed="false">没有 mcpServers</button></div></div><p class="dh-note">连接状态、工具列表与程序输出都是示例数据；添加、导入、保存、重新连接、确认工具与删除只做视觉反馈，刷新后恢复。本页不会运行任何命令或连接任何地址。</p><p class="dh-note">本机登录：产品里由浏览器是否持有有效授权决定，app 内无此切换。</p><p class="dh-note">服务器列表：产品里由是否已登记服务器决定，app 内无此切换。</p><p class="dh-note">检查结果（导入时）：产品里由粘贴的文档决定，app 内无此切换。</p></div>
<script src="../demo-harness.js"></script>
<script src="../_shared/agent-console-shell.js"></script>
<script>
AcvShell.mount('mcp-catalog');
const REQ='<span class="acv-fld-tag acv-req">必填</span>',OPT='<span class="acv-fld-tag acv-opt">选填</span>';
const KEEP='••••••';
const amcInitial=[
 {name:'github',transport:'stdio',command:'npx',args:['-y','@modelcontextprotocol/server-github'],cwd:'',envKeys:['GITHUB_PERSONAL_ACCESS_TOKEN'],sandbox:null,timeout:60,trusted:true,enabled:true,state:'connected',server:'github-mcp-server 0.6.0',protocol:'2026-07-28',since:'11-08 09:12',error:'',retryAt:'',retries:0,stderr:'GitHub MCP Server running on stdio',

  tools:[{name:'list_items',d:'列出店铺商品',on:true},{name:'draft_listing',d:'草拟上架内容，不发布',on:true,pending:'changed',changed:['说明','参数'],was:'草拟上架内容'},{name:'publish_listing',d:'发布商品',on:true,pending:'new'},{name:'confirm_payment',d:'确认收款',on:true,needsUser:true}],used:[['Alice','运营团队','经营分析']]},

 {name:'taobao-browser',transport:'stdio',command:'/usr/local/bin/taobao-mcp',args:['--profile','shop'],cwd:'',envKeys:[],sandbox:null,timeout:60,trusted:false,enabled:false,state:'disabled',server:'',protocol:'',since:'',error:'',retryAt:'',retries:0,stderr:'',tools:[],used:[]}
];

 several:{result:[AMC_FS,{name:'notion',ok:true,kind:'stdio',note:'本机程序 · 默认不可信、未绑定；需要填写：NOTION_TOKEN',line:'npx -y @notionhq/notion-mcp-server',add:{name:'notion',transport:'stdio',command:'npx',args:['-y','@notionhq/notion-mcp-server'],cwd:'',envKeys:[],sandbox:null}},{name:'search-api',ok:true,kind:'http',note:'网址 · 默认不可信、未绑定',line:'https://search.example.com/mcp',add:{name:'search-api',transport:'http',url:'https://search.example.com/mcp',headerKeys:['Authorization'],oauth:null,dpop:false}},{name:'github',ok:false,note:'已有同名服务器'},{name:'legacy-notes',ok:false,note:'SSE 传输，不支持'},{name:'my notes',ok:false,note:'名称不合法：只能包含英文字母、数字、_ 和 -，1–32 个字符'},{name:'scratch',ok:false,note:'缺少命令或网址'}]},
 single:{result:[AMC_FS,{name:'github',ok:false,note:'已有同名服务器'}]},
 notJson:{error:'不是有效的 JSON'},
 noServers:{error:'没有找到 mcpServers 对象'},
};
let amcCheck='several';
let amc=JSON.parse(JSON.stringify(amcInitial)),amcSel=null,amcMode='server',amcForm=null,amcDelete=false,amcNote='',amcImport=null;
const amcEl=id=>document.getElementById(id);
const amcEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={connected:['已连接','acv2-badge acv2-completed'],connecting:['连接中','acv2-badge acv2-running'],disconnected:['已断开','acv2-badge acv2-waiting'],failed:['连接失败','acv2-badge acv2-failed'],disabled:['已停用','acv2-badge']};
const chip=s=>`<span class="${ST[s][1]}">${ST[s][0]}</span>`;
const where=s=>s.transport==='stdio'?[s.command.split('/').pop(),...s.args].join(' '):s.url;
const usable=s=>s.tools.filter(t=>t.on&&!t.pending&&!t.needsUser).length;
const held=s=>s.tools.filter(t=>t.pending).length;
const cur=()=>amc.find(s=>s.name===amcSel);
function amcRows(){amcEl('amc-count').textContent=`${amc.length} 个`;amcEl('amc-rows').innerHTML=amc.length?'':'<tr><td colspan="5"><div class="acv2-empty"><strong>还没有 MCP 服务器。</strong><p>点「添加服务器」登记本机程序。</p></div></td></tr>';if(!amc.length)return;amcEl('amc-rows').innerHTML=amc.map(s=>`<tr aria-selected="${amcSel===s.name&&amcMode==='server'}"><td><button class="acv5-name amc-mono" type="button" data-open="${amcEsc(s.name)}">${amcEsc(s.name)}</button></td><td>${s.transport==='stdio'?'本机程序':'网址'}<span class="amc-sub amc-mono" title="${amcEsc(where(s))}">${amcEsc(where(s))}</span></td><td>${chip(s.state)}${s.error&&s.state!=='connected'?`<span class="amc-sub" title="${amcEsc(s.error)}">${amcEsc(s.error)}</span>`:''}${s.retryAt?`<span class="amc-sub">将于 ${s.retryAt} 自动重试</span>`:''}</td><td>${s.tools.length?`${s.tools.length} 个${usable(s)<s.tools.length?`（可用 ${usable(s)} 个）`:''}`:'—'}${held(s)?`<span class="amc-sub"><span class="acv2-badge acv2-waiting">${held(s)} 个待复核</span></span>`:''}</td><td>${s.used.length?`${s.used.length} 个能力档`:'未绑定'}</td></tr>`).join('');}
function statusHtml(s){const rows=[['状态',chip(s.state)+(s.state==='disconnected'?'　下次调用时自动重新连接':'')],...(s.server?[['服务器',`<span class="amc-mono">${amcEsc(s.server)}</span>`]]:[]),...(s.protocol?[['协议',`<span class="amc-mono">${amcEsc(s.protocol)}</span>`]]:[]),...(s.oauth?[['认证',`OAuth client_credentials · 客户端 <span class="amc-mono">${amcEsc(s.oauth.clientId)}</span>${s.dpop?' · DPoP':''}`]]:s.headerKeys?.length?[['认证',`请求头 <span class="amc-mono">${s.headerKeys.map(amcEsc).join('、')}</span>`]]:[]),...(s.sandbox?[['沙箱',`开（${s.sandbox.domains.length?'放行 '+s.sandbox.domains.map(amcEsc).join('、'):'断网'}；${s.sandbox.read.length?'可读 '+s.sandbox.read.map(amcEsc).join('、')+'；':''}${s.sandbox.write.length?'可写 '+s.sandbox.write.map(amcEsc).join('、'):'不可写其他目录'}）`]]:[]),...(s.since&&s.state==='connected'?[['连接于',s.since]]:[]),...(s.error?[['原因',amcEsc(s.error)]]:[]),...(s.retryAt?[['自动重试',`将于 ${s.retryAt} 自动重试（已连续失败 ${s.retries} 次；间隔每次翻倍，最长 10 分钟）`]]:[]),['工具注解',s.trusted?'采信（已标为可信服务器）':'不采信（未标为可信，一律按可能修改数据对待）']];
 return `<section class="acf-section"><div class="amc-head-row"><h3>连接状态</h3>${s.enabled?'<button class="acv2-button" type="button" data-reconnect>重新连接</button>':''}</div><dl class="amc-kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${s.stderr?`<details class="amc-out"><summary>程序输出（末尾）</summary><pre>${amcEsc(s.stderr)}</pre></details>`:''}</section>`;}
function toolsHtml(s){if(!s.tools.length)return '';const h=held(s);return `<section class="acf-section"><div class="amc-head-row"><div class="acv-tip-row"><h3>工具（共 ${s.tools.length} 个${s.tools.some(t=>!t.on)?`，启用 ${s.tools.filter(t=>t.on).length} 个`:''}）</h3>${AcvShell.tip(`勾选的工具提供给绑定了它的执行者；取消勾选即停用，下一次调用起生效，包括进行中的事务。\n· 新增的、定义有变化的工具暂停提供，核对说明和参数后点「确认」。\n· 服务器标为需人工确认的工具不提供。\n· 工具在执行者中的名称为 mcp__${s.name}__工具名。`)}</div>${h>1?`<button class="acv2-button" type="button" data-approve="*">全部确认（${h}）</button>`:''}</div><div class="amc-tools">${s.tools.map(t=>`<label class="amc-tool"><input type="checkbox" data-tool="${amcEsc(t.name)}" ${t.on?'checked':''}><span><b>${amcEsc(t.name)}</b>${s.trusted&&t.ro?'<span class="acv2-badge acv2-completed">只读</span>':''}${s.trusted&&t.dx?'<span class="acv2-badge acv2-waiting">可能修改数据</span>':''}${t.needsUser?'<span class="acv2-badge acv2-failed">需人工确认，不提供</span>':''}${t.pending?`<span class="acv2-badge acv2-waiting">${t.pending==='new'?'新增，待复核':'定义有变化，待复核'}</span>`:''}<small>${amcEsc(t.d)}</small>${t.pending==='changed'?`<small>变化的部分：${t.changed.join('、')}；原说明：${amcEsc(t.was)}</small>`:''}</span>${t.pending?`<button class="acv2-button" type="button" data-approve="${amcEsc(t.name)}">确认</button>`:''}</label>`).join('')}</div></section>`;}
function usedHtml(s){return `<section class="acf-section"><div class="acv-tip-row"><h3>绑定的能力档</h3>${AcvShell.tip('这些执行者能力档的执行者可以使用它的工具。\n· 要解除，请到团队管理解绑。')}</div>${s.used.length?`<ul class="acv5-list">${s.used.map(u=>`<li><span>${amcEsc(u[0])} · ${amcEsc(u[1])}<small>能力档：${amcEsc(u[2])}</small></span><button class="acv2-button" type="button" data-goto="agent-console/team-management" data-goto-href="../agent-console/prototype-team-management.html">去团队管理解绑</button></li>`).join('')}</ul>`:'<p class="acf-section-note" style="margin:0">还没有能力档绑定它。在团队管理的执行者能力档里绑定，绑定时需要你确认。</p>'}</section>`;}
// The exact program or address the owner confirms: shown for a new server, and when command, arguments or URL change.
function launchLine(f){return f.transport==='stdio'?[f.command,...f.args.split('\n').map(a=>a.trim()).filter(Boolean)].join(' '):f.url;}
function needsConfirm(){if(amcMode==='new')return true;const s=cur();return launchLine(amcForm)!==launchLine({transport:s.transport,command:s.command??'',args:(s.args??[]).join('\n'),url:s.url??''})||amcForm.transport!==s.transport;}
function formHtml(){const f=amcForm,isNew=amcMode==='new',s=isNew?null:cur(),stdio=f.transport==='stdio';
 const pairs=(keys,sep)=>keys.map(k=>`${k}${sep}${KEEP}`).join('\n');
 return `<section class="acf-section"><div class="acv-tip-row"><h3>配置</h3>${AcvShell.tip(`环境变量、请求头和密钥的值只进不出。\n· 已保存的值显示为 ${KEEP}，不修改即沿用。\n· 错误信息和程序输出里出现时替换为 ***。`)}</div>
<div class="acf-fields"><label class="acf-field"><span class="acv-tip-row">名称${REQ}${AcvShell.tip('英文字母、数字、_ 和 -，1–32 个字符，创建后不可修改。\n· 工具在执行者中的名称为 mcp__名称__工具名。')}</span><input class="acv2-input amc-mono" data-f="name" value="${amcEsc(f.name)}" maxlength="32" placeholder="如：github" ${isNew?'':'disabled'}></label></div>
<div class="acf-field" style="margin-top:10px"><span class="acv-tip-row">连接方式${REQ}</span><div class="amc-radios"><label><input type="radio" name="amc-kind" data-kind="stdio" ${stdio?'checked':''}>本机程序（stdio）</label><label><input type="radio" name="amc-kind" data-kind="http" ${stdio?'':'checked'}>网址（Streamable HTTP）</label></div></div>
${stdio?`<div class="acf-fields" style="margin-top:10px"><label class="acf-field"><span class="acv-tip-row">命令${REQ}</span><input class="acv2-input amc-mono" data-f="command" value="${amcEsc(f.command)}" placeholder="如：npx"></label><label class="acf-field"><span class="acv-tip-row">工作目录${OPT}</span><input class="acv2-input amc-mono" data-f="cwd" value="${amcEsc(f.cwd)}" placeholder="留空为家目录"></label></div>
<label class="acf-field" style="margin-top:10px"><span class="acv-tip-row">参数${OPT}${AcvShell.tip('每行一个参数。')}</span><textarea class="amc-pairs" data-f="args" placeholder="-y&#10;@modelcontextprotocol/server-github">${amcEsc(f.args)}</textarea></label>
<label class="acf-field" style="margin-top:10px"><span class="acv-tip-row">环境变量${OPT}${AcvShell.tip(`每行一个 名称=值。\n· 只给这里配置的变量和 PATH、HOME 等基础变量，拿不到模型 key。\n· 已保存的值显示为 ${KEEP}，不修改即沿用。`)}</span><textarea class="amc-pairs" data-f="env" placeholder="GITHUB_PERSONAL_ACCESS_TOKEN=…">${amcEsc(isNew?'':pairs(s.envKeys??[],'='))}</textarea></label>
<label class="acf-check" style="margin-top:10px"><input type="checkbox" data-f="sandbox" ${f.sandbox?'checked':''}>在沙箱中运行（仅 macOS）${AcvShell.tip('经 sandbox-runtime 启动，每个服务器一个进程。\n· 网络只放行填写的域名，不填即断网；用 npx 启动的，需放行 registry.npmjs.org。\n· 读不到家目录和状态目录，填写的目录、工作目录和参数里写明的文件除外。\n· 只能写可读写的目录。\n· 每个服务器有自己的 npm 缓存，不读 ~/.npmrc；不提供 uv、pip 等其他工具的缓存。')}</label>
${f.sandbox?`<div class="acf-fields" style="margin-top:8px"><label class="acf-field">放行的域名<textarea class="amc-pairs" data-f="sbDomains" placeholder="registry.npmjs.org">${amcEsc(f.sbDomains)}</textarea></label><label class="acf-field">可读的目录<textarea class="amc-pairs" data-f="sbRead" placeholder="/Users/me/reference">${amcEsc(f.sbRead)}</textarea></label><label class="acf-field">可读写的目录<textarea class="amc-pairs" data-f="sbWrite" placeholder="/Users/me/agent-work">${amcEsc(f.sbWrite)}</textarea></label></div>`:''}`
:`<div class="acf-fields" style="margin-top:10px"><label class="acf-field"><span class="acv-tip-row">网址${REQ}</span><input class="acv2-input amc-mono" data-f="url" value="${amcEsc(f.url)}" placeholder="https://example.com/mcp"></label></div>
<label class="acf-field" style="margin-top:10px"><span class="acv-tip-row">请求头${OPT}${AcvShell.tip(`每行一个 名称: 值。\n· 已保存的值显示为 ${KEEP}，不修改即沿用。`)}</span><textarea class="amc-pairs" data-f="headers" placeholder="Authorization: Bearer …">${amcEsc(isNew?'':pairs(s.headerKeys??[],': '))}</textarea></label>
<label class="acf-check" style="margin-top:10px"><input type="checkbox" data-f="dpop" ${f.dpop?'checked':''}>用 DPoP 出示令牌（RFC 9449）</label>
<div class="acf-fields" style="margin-top:10px"><label class="acf-field"><span class="acv-tip-row">OAuth 授权服务器${OPT}${AcvShell.tip('用于无人值守的 client_credentials。\n· 密钥只发给这里填写的授权服务器。')}</span><input class="acv2-input amc-mono" data-f="issuer" value="${amcEsc(f.issuer)}" placeholder="https://auth.example.com"></label><label class="acf-field">客户端 ID<input class="acv2-input amc-mono" data-f="clientId" value="${amcEsc(f.clientId)}"></label><label class="acf-field">客户端密钥<input class="acv2-input amc-mono" type="password" value="${f.issuer&&!isNew?KEEP:''}" placeholder="只进不出"></label><label class="acf-field">权限范围（可选）<input class="acv2-input amc-mono" data-f="scope" value="${amcEsc(f.scope)}"></label></div>`}
<div class="acf-fields" style="margin-top:10px"><label class="acf-field"><span class="acv-tip-row">超时（秒）${OPT}${AcvShell.tip('单次调用的超时，1–600 秒；留空为 60 秒。')}</span><input class="acv2-input" type="number" min="1" max="600" data-f="timeout" value="${f.timeout===60?'':f.timeout}" placeholder="60"></label></div>
<div class="acf-checks" style="margin-top:10px"><label class="acf-check"><input type="checkbox" data-f="trusted" ${f.trusted?'checked':''}><span>可信<small>采信工具注解（只读、可能修改数据）</small></span></label><label class="acf-check"><input type="checkbox" data-f="enabled" ${f.enabled?'checked':''}><span>启用<small>停用后断开连接，所有执行者从下一次调用起都不能使用其工具，包括进行中的事务；配置保留</small></span></label></div>
${needsConfirm()?`<div class="acf-grant"><strong>确认登记</strong> ${stdio?'本机将运行':'将连接'}：<code>${amcEsc(launchLine(f)||'（尚未填写）')}</code>${!isNew&&s.used.length?`已绑定到 ${s.used.length} 个能力档。确认后服务器重新连接，之后的每次调用都使用新的${stdio?'命令':'地址'}，包括进行中的事务；定义有变化的工具会暂停提供，复核后再提供。`:'登记后还要在团队管理里绑定到能力档，执行者才能使用；绑定时会再次确认。'}</div>`:''}
<div class="acf-savebar" data-state="${amcNote?'saved':'clean'}"><span>${amcNote||(isNew?'添加后即开始连接。':'保存后重新连接；只改可信或停用工具时不重新连接。')}</span><button class="acv2-button acv2-primary" type="button" data-save>${isNew?'确认并添加':needsConfirm()?'确认并保存':'保存'}</button></div></section>`;}
function dangerHtml(s){return `<section class="acf-section acf-danger"><h3>删除</h3>${s.used.length?`<p class="acf-section-note">被 ${s.used.length} 个能力档绑定。先在团队管理解绑，才能删除。</p><button class="acv2-button acf-danger-button" type="button" disabled>删除服务器</button>`:amcDelete?`<div class="acf-inline-confirm">删除「${amcEsc(s.name)}」：断开连接，配置和已保存的凭证一并删除。<div class="acf-row-actions"><button class="acv2-button acf-danger-button" type="button" data-delete-confirm>确认删除</button><button class="acv2-button" type="button" data-delete-cancel>取消</button></div></div>`:`<p class="acf-section-note">没有能力档绑定它，可以删除。</p><button class="acv2-button acf-danger-button" type="button" data-delete>删除服务器</button>`}</section>`;}
const importLines=(kind,label)=>{const l=amcImport.result.filter(r=>r.ok&&r.kind===kind);return l.length?`${label}：<code>${l.map(r=>amcEsc(r.line)).join('<br>')}</code>`:'';};
function importHtml(){return `<section class="acf-section"><div class="acv-tip-row"><h3>导入 JSON</h3>${AcvShell.tip('粘贴 Claude Desktop、Cursor 等使用的 {"mcpServers": {…}}，一次导入多个。\n· 导入的服务器默认不可信、不绑定任何能力档。\n· 已有同名的、SSE 传输的、名称不合法的跳过。')}</div><textarea class="amc-pairs" style="min-height:150px" data-json placeholder='{"mcpServers": {"github": {"command": "npx", "args": ["-y", "@modelcontextprotocol/server-github"], "env": {"GITHUB_PERSONAL_ACCESS_TOKEN": "…"}}}}'>${amcEsc(amcImport?.text??'')}</textarea>${amcImport?.error?`<p class="amc-import-error">${amcEsc(amcImport.error)}</p>`:''}${amcImport?.result?`<ul class="amc-import-result">${amcImport.result.map(r=>`<li>${r.ok?'<span class="acv2-badge acv2-completed">将导入</span>':'<span class="acv2-badge">跳过</span>'} <span class="amc-mono">${amcEsc(r.name)}</span><small>${amcEsc(r.note)}</small></li>`).join('')}</ul>${amcImport.result.some(r=>r.ok)?`<div class="acf-grant"><strong>确认登记</strong> ${importLines('stdio','本机将运行')}${importLines('http','将连接')}导入后默认不可信，还要在团队管理里绑定到能力档。</div>`:''}`:''}<div class="acf-row-actions">${amcImport?.result?.some(r=>r.ok)?'<button class="acv2-button acv2-primary" type="button" data-import-confirm>确认并导入</button>':'<button class="acv2-button acv2-primary" type="button" data-import-check>检查</button>'}</div></section>`;}
function formFrom(s){return s?{name:s.name,transport:s.transport,command:s.command??'',args:(s.args??[]).join('\n'),cwd:s.cwd??'',sandbox:!!s.sandbox,sbDomains:(s.sandbox?.domains??[]).join('\n'),sbRead:(s.sandbox?.read??[]).join('\n'),sbWrite:(s.sandbox?.write??[]).join('\n'),url:s.url??'',dpop:!!s.dpop,issuer:s.oauth?.issuer??'',clientId:s.oauth?.clientId??'',scope:s.oauth?.scope??'',timeout:s.timeout,trusted:s.trusted,enabled:s.enabled}:{name:'',transport:'stdio',command:'',args:'',cwd:'',sandbox:false,sbDomains:'',sbRead:'',sbWrite:'',url:'',dpop:false,issuer:'',clientId:'',scope:'',timeout:60,trusted:false,enabled:true};}
function amcRender(){amcRows();amcEl('amc-check-group').hidden=!(amcSel!==null&&amcMode==='import');if(amcSel===null){amcEl('amc-drawer').hidden=true;return;}amcEl('amc-drawer').hidden=false;
 if(amcMode==='import'){amcEl('amc-kind').textContent='粘贴 mcpServers 配置，一次导入多个';amcEl('amc-title').textContent='导入 MCP 服务器';amcEl('amc-body').innerHTML=importHtml();return;}
 if(amcMode==='new'){amcEl('amc-kind').textContent='添加后即开始连接';amcEl('amc-title').textContent='添加 MCP 服务器';amcEl('amc-body').innerHTML=formHtml();return;}
 const s=cur();amcEl('amc-kind').textContent=[s.transport==='stdio'?'本机程序（stdio）':'网址（Streamable HTTP）',ST[s.state][0],s.tools.length?`${s.tools.length} 个工具${usable(s)<s.tools.length?`，可用 ${usable(s)} 个`:''}`:''].filter(Boolean).join(' · ');amcEl('amc-title').textContent=s.name;amcEl('amc-body').innerHTML=statusHtml(s)+toolsHtml(s)+usedHtml(s)+formHtml()+dangerHtml(s);}
function amcOpen(name,mode='server'){amcSel=name;amcMode=mode;amcDelete=false;amcNote='';amcForm=formFrom(mode==='server'?amc.find(s=>s.name===name):null);if(mode==='import')amcImport={text:'',result:null,error:''};amcRender();}
function amcClose(){amcSel=null;amcRender();}
document.addEventListener('click',e=>{
 const list=e.target.closest('[data-amc-list]');if(list){for(const b of document.querySelectorAll('[data-amc-list]'))b.setAttribute('aria-pressed',String(b===list));amc=list.dataset.amcList==='empty'?[]:JSON.parse(JSON.stringify(amcInitial));amcClose();return;}
 const chk=e.target.closest('[data-amc-check]');if(chk){for(const b of document.querySelectorAll('[data-amc-check]'))b.setAttribute('aria-pressed',String(b===chk));amcCheck=chk.dataset.amcCheck;if(amcImport){amcImport.result=null;amcImport.error='';}amcRender();return;}
 if(e.target.closest('[data-demo-harness]'))return;
 const open=e.target.closest('[data-open]');if(open){amcOpen(open.dataset.open);return;}
 const ap=e.target.closest('[data-approve]');if(ap){e.preventDefault();const s=cur();for(const t of s.tools)if(ap.dataset.approve==='*'||t.name===ap.dataset.approve){delete t.pending;delete t.changed;}amcRender();return;}
 if(e.target.closest('[data-reconnect]')){const s=cur();if(s.state==='failed'){s.state='connecting';s.retryAt='';}amcRender();return;}
 if(e.target.closest('[data-save]')){const f=amcForm;if(amcMode==='new'){if(!f.name.trim()||!launchLine(f))return;amc.push({name:f.name.trim(),transport:f.transport,command:f.command,args:f.args.split('\n').filter(Boolean),cwd:f.cwd,envKeys:[],url:f.url,headerKeys:[],oauth:f.issuer?{issuer:f.issuer,clientId:f.clientId,scope:f.scope}:null,sandbox:f.sandbox?{domains:f.sbDomains.split('\n').filter(Boolean),read:f.sbRead.split('\n').filter(Boolean),write:f.sbWrite.split('\n').filter(Boolean)}:null,dpop:f.dpop,timeout:f.timeout,trusted:f.trusted,enabled:f.enabled,state:f.enabled?'connecting':'disabled',server:'',protocol:'',since:'',error:'',retryAt:'',retries:0,stderr:'',tools:[],used:[]});amcOpen(f.name.trim());amcNote='已添加，正在连接。';amcRender();return;}
  const s=cur();Object.assign(s,{transport:f.transport,command:f.command,args:f.args.split('\n').filter(Boolean),cwd:f.cwd,url:f.url,timeout:f.timeout,trusted:f.trusted,enabled:f.enabled,state:f.enabled?s.state:'disabled'});amcForm=formFrom(s);amcNote='已保存：新事务使用新配置。';amcRender();return;}
 if(e.target.closest('[data-delete]')){amcDelete=true;amcRender();return;}
 if(e.target.closest('[data-delete-cancel]')){amcDelete=false;amcRender();return;}
 if(e.target.closest('[data-delete-confirm]')){amc=amc.filter(s=>s.name!==amcSel);amcClose();return;}
 if(e.target.closest('[data-import-check]')){const out=AMC_CHECK[amcCheck];amcImport.result=out.result??null;amcImport.error=out.error??'';amcRender();return;}
 if(e.target.closest('[data-import-confirm]')){const ok=amcImport.result.filter(r=>r.ok);for(const r of ok)amc.push({...r.add,timeout:60,trusted:false,enabled:true,state:'connecting',server:'',protocol:'',since:'',error:'',retryAt:'',retries:0,stderr:'',tools:[],used:[]});amcOpen(ok[0].name);amcNote=ok.length>1?`已导入 ${ok.length} 个，正在连接。`:'已导入，正在连接。';amcRender();return;}
 if(!amcEl('amc-drawer').hidden&&!e.target.closest('#amc-drawer,button,input,select,textarea,label,a'))amcClose();
});
document.addEventListener('change',e=>{
 const kind=e.target.dataset.kind;if(kind){amcForm.transport=kind;amcRender();return;}
 const tool=e.target.dataset.tool;if(tool){const t=cur().tools.find(x=>x.name===tool);t.on=e.target.checked;amcRows();return;}
 const k=e.target.dataset.f;if(k&&e.target.type==='checkbox'){amcForm[k]=e.target.checked;amcNote='';amcRender();}
});
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(k&&e.target.type!=='checkbox'){amcForm[k]=e.target.type==='number'?Number(e.target.value||60):e.target.value;amcNote='';const was=!!document.querySelector('#amc-body .acf-grant');if(['command','args','url'].includes(k)&&was!==needsConfirm()){const at=e.target.selectionStart;amcRender();const el=document.querySelector(`[data-f="${k}"]`);el.focus();el.setSelectionRange(at,at);return;}const code=document.querySelector('#amc-body .acf-grant code');if(code&&['command','args','url'].includes(k))code.textContent=launchLine(amcForm)||'（尚未填写）';}
 if(e.target.matches('[data-json]')){amcImport.text=e.target.value;amcImport.result=null;amcImport.error='';}});
amcEl('amc-new').addEventListener('click',()=>amcOpen('','new'));amcEl('amc-import').addEventListener('click',()=>amcOpen('','import'));amcEl('amc-close').addEventListener('click',amcClose);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&amcSel!==null)amcClose();});
amcRender();
</script>
<script>
  // Cross-prototype navigation: inside the gallery ask the parent page to switch; when opened alone, go to the file directly
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
</body>
</html>
