.atm-profile{border:1px solid var(--acv-line);border-radius:8px;padding:12px;margin-top:10px}
.atm-profile-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}

.atm-skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 14px}

</main></div>

<script>
AcvShell.mount('team-management');
const atmGroups=[{id:'g1',name:'银河护卫队'},{id:'g2',name:'产品讨论组'}];

const atmSkills=[['listing-writer','商品文案','闲鱼、淘宝标题与详情写法'],['market-analysis','竞品定价','整理竞品价格区间与来源'],['trip-check','行程核对','逐段核对站名、换乘与开放时间并注明来源'],['meal-plan','餐单规划','按口味与预算安排菜单'],['code-review','代码审阅','定位问题并给出补丁建议'],['patch-writer','补丁草稿','生成可审阅的补丁与测试用例'],['visual-brief','视觉方案','主图、海报的构图与文案建议'],['doc-style','文档规范','产品文档与发布说明的写法'],['weekly-report','周报整理','把一周的事务记录整理成周报']];

const atmStatus={fixed:['固定','acv2-badge'],active:['正常接单','acv2-badge acv2-completed'],onboarding:['接入未完成','acv2-badge acv2-waiting'],draining:['停止接单 · 做完后移除','acv2-badge acv2-waiting'],removed:['已删除 · 历史保留','acv2-badge']};
const atmInitial={mcps:[{id:'github',name:'github',kind:'command',target:'npx -y @modelcontextprotocol/server-github',state:'connected',tools:3},{id:'xianyu-browser',name:'xianyu-browser',kind:'command',target:'/usr/local/bin/xianyu-mcp --profile alice-analysis',state:'connected',tools:2},{id:'amap',name:'amap',kind:'remote',target:'https://mcp.example.com/amap-routes',state:'connected',tools:2},{id:'docs-search',name:'docs-search',kind:'remote',target:'https://docs-mcp.example.com/mcp',state:'failed',tools:0},{id:'taobao-browser',name:'taobao-browser',kind:'command',target:'/usr/local/bin/taobao-mcp --profile shop',state:'disabled',tools:0}],teams:[
 {id:'sam',name:'Sam',team:'总协调',tone:'var(--acv-sam)',fixed:true,app:'cli_a71f0c2e9d3b4815',mode:'manual',status:'fixed',groups:['g1','g2'],duty:'识别群消息意图，把事务交给合适的负责人；跨团队的需要由 Sam 指派并在群里通报。',prompt:'只协调、澄清和分派，不执行具体事务。',profiles:[],onboard:atmStages.done.slice(),active:0},
 {id:'alice',name:'Alice',team:'运营团队',tone:'var(--acv-alice)',app:'cli_b28e4d1a7f6c0932',mode:'manual',status:'active',groups:['g1','g2'],duty:'闲鱼、淘宝等网站运营，包括商品文案、上架材料和经营分析。',prompt:'把运营事务拆成文案、分析等分工，汇总后在群里汇报。',profiles:[{name:'商品文案',prompt:'按平台规范写标题与详情，不编造商品事实。',tools:['files.read','files.write'],mcps:[],skills:['listing-writer']},{name:'经营分析',prompt:'整理竞品与价格，标注数据来源和时间。',tools:['files.read'],mcps:['xianyu-browser'],skills:['market-analysis']}],onboard:atmStages.done.slice(),active:2,work:{g1:{active:2,tasks:[{id:'ta1',name:'闲鱼数据日报',when:'每天 09:00'}],waiting:[{id:'R-2402',title:'R-2402 商品 B 卖点',who:'本人',why:'等待确认目标客群'}]},g2:{active:0,tasks:[{id:'ta2',name:'竞品价格周报',when:'每周一 10:00'}],waiting:[]}}},

 {id:'jack',name:'Jack',team:'技术团队',tone:'var(--acv-jack)',app:'cli_f60c3b8d2e9a1574',mode:'manual',status:'active',groups:['g1'],duty:'技术事务和开发需求，包括代码分析、补丁、测试设计和技术研究。',prompt:'把技术事务拆成分析与补丁等分工，如实说明未运行的验证。',profiles:[{name:'代码与脚本',prompt:'只交付可审阅的代码，不运行。',tools:['files.read','files.write'],mcps:['github'],skills:['patch-writer']},{name:'技术分析',prompt:'定位原因并给出补丁建议。',tools:['files.read'],mcps:[],skills:['code-review']}],onboard:atmStages.done.slice(),active:1},
 {id:'daisy',name:'Daisy',team:'设计团队',tone:'var(--atm-daisy)',app:'cli_c93a5b7e2d1f4086',mode:'qr',status:'onboarding',groups:['g1'],duty:'商品主图、海报和活动页面的视觉方案。',prompt:'',profiles:[{name:'视觉方案',prompt:'',tools:['files.read','files.write'],mcps:[],skills:['visual-brief']}],onboard:atmStages.blocked.slice(),active:0},
 {id:'eve',name:'Eve',team:'内容团队',tone:'var(--atm-eve)',app:'cli_d04b6c8f3e2a5197',mode:'manual',status:'draining',deleting:true,draining:['g2'],groups:['g2'],work:{g2:{active:1,tasks:[{id:'te1',name:'发布说明提醒',when:'每周五 17:00'},{id:'te2',name:'文档巡检',when:'每月 1 日 10:00'}],waiting:[{id:'R-2388',title:'R-2388 校对 3.2 发布说明',who:'本人',why:'等待确认术语表'},{id:'R-2384',title:'R-2384 整理 FAQ',who:'成员 小林',why:'等待补充截图'}]}},duty:'产品文档与发布说明的撰写和校对。',prompt:'按文档规范撰写，交付前自查术语一致。',profiles:[{name:'文档撰写',prompt:'按文档规范撰写与校对。',tools:['files.read','files.write'],mcps:[],skills:['doc-style']}],onboard:atmStages.done.slice(),active:1}
]};
let atm=JSON.parse(JSON.stringify(atmInitial));
let atmSaveMode='real',atmSaveErr=null,atmTaskDel=null,atmSelected='alice',atmQuery='',atmFilter='all',atmMcpPick=null,atmDelete=null,atmDirty=new Set(),atmSaved=new Set(),atmStage='scan',atmNextId=1;
const atmEl=id=>document.getElementById(id);
const atmEsc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const atmCleared=(t,g)=>{const w=atmWork(t,g);return !w.active&&!w.tasks.length&&!w.waiting.length;};
// A removal completes once its group has no active Assignments, scheduled tasks or waiting requests left for the team.
function atmSettle(t){for(const g of [...(t.draining??[])])if(atmCleared(t,g)){t.draining=t.draining.filter(x=>x!==g);t.groups=t.groups.filter(x=>x!==g);t.removedNote=`已从${atmGroupName(g)}移除并解绑，历史记录保留。`;}if(t.deleting&&!t.draining.length){t.status='removed';t.active=0;}}
function atmRemoval(t,g){const w=atmWork(t,g),gn=atmGroupName(g),n=atmEsc(atmName(t)),targets=atm.teams.filter(x=>x.id!==t.id&&atmAccepting(x,g));
 const tasks=w.tasks.map(k=>`<li><span>${atmEsc(k.name)}<small>${k.when} · 用 ${n} 的身份发送</small></span>${atmTaskDel===k.id?`<div class="acf-inline-confirm">删除后不再执行，已有的执行记录保留。<div class="acf-row-actions"><button class="acv2-button acf-danger-button" type="button" data-task-del-ok="${t.id}:${g}:${k.id}">确认删除</button><button class="acv2-button" type="button" data-task-del-cancel>取消</button></div></div>`:`<select class="acv2-input" data-task-move="${t.id}:${g}:${k.id}" aria-label="把「${atmEsc(k.name)}」转给其他团队"><option value="">转给…</option>${targets.map(x=>`<option value="${x.id}">${atmEsc(atmName(x))} · ${atmEsc(atmTeamName(x))}</option>`).join('')}</select><button class="acv2-button" type="button" data-task-del="${k.id}">删除</button>`}</li>`).join('');
 const waiting=w.waiting.map(q=>`<li><span><button class="atm-link" type="button" data-goto="agent-console/team-structures" data-goto-href="../agent-console/prototype-team-structures.html">${atmEsc(q.title)}</button><small>发起人：${atmEsc(q.who)} · ${atmEsc(q.why)}</small></span></li>`).join('');
 const step=(state,title,note,items='')=>`<li><div>${title}<small>${note}</small></div><span class="${state==='done'?'acv2-badge acv2-completed':state==='block'?'acv2-badge acv2-failed':'acv2-badge acv2-waiting'}">${state==='done'?'已完成':state==='block'?'需处理':'等待中'}</span>${items}</li>`;
 return `<div class="atm-removal"><div class="atm-removal-h">${gn} · 移除进行中</div><ol class="atm-removal-steps">${step('done','停止接单',`Sam 已不再分派给 ${n}，并在${gn}公告它离开；各负责人的团队通讯录已更新。`)}${step(w.active?'wait':'done',`进行中的分工 · ${w.active} 项`,w.active?`做完后由 ${n} 在群里收尾。`:'已全部结束。')}${step(w.tasks.length?'block':'done',`用 ${n} 身份发送的定时任务 · ${w.tasks.length} 项`,w.tasks.length?`每项转给${gn}里其他接单的团队，或删除，才能完成移除。转给后只换发送身份，计划和内容不变。`:'已全部处理。',w.tasks.length?`<ul class="atm-removal-items">${tasks}</ul>`:'')}${step(w.waiting.length?'wait':'done',`等待发起人确认的事务 · ${w.waiting.length} 项`,w.waiting.length?'只有发起人能确认或取消；本人发起的可在记录里处理，其他成员的等他们回复。':'已全部结束。',w.waiting.length?`<ul class="atm-removal-items">${waiting}</ul>`:'')}</ol>${t.taskNote?`<p class="atm-done-note" role="status">${atmEsc(t.taskNote)}</p>`:''}<p class="atm-removal-note">以上都结束后自动从${gn}解绑，历史记录保留。</p></div>`;}
function atmValidate(t){if(atmSaveMode==='stale')return {stale:true,reasons:['这个团队已在其他页面保存过新版本；为避免覆盖，本次保存没有生效。']};if(atmSaveMode==='invalid')return {reasons:['缺少负责人名称','至少需要一个执行者能力档','两个能力档同名：「商品文案」','App ID cli_a71f0c2e9d3b4815 已被 Sam 使用，每个团队需要自己的飞书应用']};
 if(t.fixed)return null;const r=[];if(!t.name.trim())r.push('缺少负责人名称');if(!t.team.trim())r.push('缺少团队名称');if(!t.profiles.length)r.push('至少需要一个执行者能力档');const names=t.profiles.map(x=>x.name),dup=names.find((x,i)=>names.indexOf(x)!==i);if(dup)r.push(`两个能力档同名：「${dup}」`);const other=t.app&&atm.teams.find(x=>x.id!==t.id&&x.app===t.app);if(other)r.push(`App ID ${t.app} 已被 ${atmName(other)} 使用，每个团队需要自己的飞书应用`);return r.length?{reasons:r}:null;}

function atmOnboarding(t){

 const mode=t.fixed?'<div class="atm-mode">接入方式：已有应用，手动填写</div>':`<div class="atm-mode">接入方式<div class="acf-seg"><button type="button" data-mode="qr" aria-pressed="${t.mode==='qr'}">扫码一键创建</button><button type="button" data-mode="manual" aria-pressed="${t.mode==='manual'}">已有应用，手动填写</button></div></div>`;
 const source=t.mode==='qr'?(t.onboard[0]==='done'?`<div class="atm-created">已创建应用 ${atmEsc(t.app)}<small>凭证已自动保存，不显示</small></div>`:`<div class="atm-qr"><div class="atm-qr-box" aria-label="二维码占位">${t.onboard[0]==='blocked'?'二维码已过期':'二维码'}</div><div><p>${t.onboard[0]==='blocked'?'这个二维码已过期，或扫码没有完成。刷新后重新扫码即可，不会创建重复的应用。':'用飞书扫码，在手机上确认创建。创建完成后，App ID 与 App Secret 自动回填，你不需要复制任何凭证。'}</p><div class="acf-row-actions"><button class="acv2-button ${t.onboard[0]==='blocked'?'acv2-primary':''}" type="button" data-qr-refresh>刷新二维码</button></div></div></div>`):`<div class="acf-fields" style="margin-top:12px"><label class="acf-field">App ID<input class="acv2-input" data-field="app" value="${atmEsc(t.app)}" placeholder="cli_…" ${t.fixed?'disabled':''}></label><div class="acf-field">App Secret<div class="acf-secret">${t.app?'已保存 · 不显示':'尚未填写'}${t.fixed?'':`<button class="acv2-button" type="button" data-fake="secret">${t.app?'替换':'填写'}</button>`}</div></div></div>`;
 const list=`<ol class="atm-onboard">${steps.map(({i,s,st},n)=>`<li data-state="${st}"><span class="atm-onboard-num">${n+1}</span><div>${s[0]}<small>${st==='blocked'?atmBlockedNote(i):s[1]}</small></div><span class="${atmStepState[st][1]}">${atmStepState[st][0]}</span></li>`).join('')}</ol>`;
 const actions=t.fixed?'':`<div class="acf-row-actions"><button class="acv2-button" type="button" data-fake="verify">重新检查</button><button class="acv2-button" type="button" data-fake="test">发送测试消息…</button></div>`;
 return mode+source+list+actions;

 const td=e.target.closest('[data-task-del]');if(td){atmTaskDel=td.dataset.taskDel;atmRender();return;}
 if(e.target.closest('[data-task-del-cancel]')){atmTaskDel=null;atmRender();return;}
 const tdo=e.target.closest('[data-task-del-ok]');if(tdo){const [tid,g,k]=tdo.dataset.taskDelOk.split(':'),t=atmTeam(tid),w=atmWork(t,g),task=w.tasks.find(x=>x.id===k);w.tasks=w.tasks.filter(x=>x.id!==k);t.taskNote=`已删除定时任务「${task.name}」，执行记录保留。`;atmTaskDel=null;atmSettle(t);atmRender();return;}
 const rl=e.target.closest('[data-reload]');if(rl){const t=atmTeam(rl.dataset.reload);atmSaveErr=null;atmDirty.delete(t.id);atmSaved.delete(t.id);t.reloaded=true;atmRender();return;}
 const sel=e.target.closest('[data-select]');if(sel){atmSelected=sel.dataset.select;atmMcpPick=null;atmDelete=null;atmSaveErr=null;atmTaskDel=null;atmRender();return;}
 const mode=e.target.closest('[data-mode]');if(mode){const t=atmTeam(atmSelected);t.mode=mode.dataset.mode;atmMarkDirty(t.id);atmRender();return;}
 const pick=e.target.closest('[data-mcp-pick]');if(pick){const [team,pi]=pick.dataset.mcpPick.split(':');atmMcpPick={team,profile:Number(pi),mcp:null};atmRender();return;}
 if(e.target.closest('[data-mcp-pick-cancel]')){atmMcpPick=null;atmRender();return;}
 if(e.target.closest('[data-mcp-bind]')){const f=atmMcpPick;atmTeam(f.team).profiles[f.profile].mcps.push(f.mcp);atmMarkDirty(f.team);atmMcpPick=null;atmRender();return;}
 const unbind=e.target.closest('[data-mcp-unbind]');if(unbind){const [team,pi,id]=unbind.dataset.mcpUnbind.split(':'),pr=atmTeam(team).profiles[Number(pi)];pr.mcps=pr.mcps.filter(x=>x!==id);atmMarkDirty(team);atmRender();return;}
 const del=e.target.closest('[data-delete]');if(del){atmDelete=del.dataset.delete;atmRender();return;}
 if(e.target.closest('[data-delete-cancel]')){atmDelete=null;atmRender();return;}
 const delOk=e.target.closest('[data-delete-confirm]');if(delOk){const t=atmTeam(delOk.dataset.deleteConfirm);t.deleting=true;t.status='draining';t.pendingRemove=[];t.draining=[...t.groups];atmSettle(t);atmDelete=null;atmRender();return;}
 const save=e.target.closest('[data-save]');if(save){const t=atmTeam(save.dataset.save),bad=atmValidate(t);t.reloaded=false;if(bad){atmSaveErr={team:t.id,...bad};atmRender();return;}atmSaveErr=null;for(const g of t.pendingRemove??[]){t.draining=[...new Set([...(t.draining??[]),g])];}t.pendingRemove=[];t.taskNote='';atmSettle(t);atmDirty.delete(t.id);atmSaved.add(t.id);atmRender();return;}
});
document.addEventListener('input',e=>{
 if(e.target.id==='atm-search'){atmQuery=e.target.value;atmEl('atm-list').innerHTML=atmListHtml();return;}
 const ed=e.target.closest('[data-editor]');if(!ed)return;const id=ed.dataset.editor;if(e.target.dataset.field)atmTeam(id)[e.target.dataset.field]=e.target.value;
 if(!atmDirty.has(id)||atmSaved.has(id)){atmMarkDirty(id);const bar=ed.querySelector('.acf-savebar');bar.dataset.state='dirty';bar.querySelector('span').textContent='有未保存的修改';}
});
document.addEventListener('change',e=>{
 if(e.target.id==='atm-filter'){atmFilter=e.target.value;atmEl('atm-list').innerHTML=atmListHtml();return;}
 if(e.target.dataset.mcpChoose){atmMcpPick.mcp=e.target.dataset.mcpChoose;atmRender();return;}
 const mv=e.target.dataset.taskMove;if(mv&&e.target.value){const [tid,g,k]=mv.split(':'),t=atmTeam(tid),w=atmWork(t,g),task=w.tasks.find(x=>x.id===k),to=atmTeam(e.target.value);w.tasks=w.tasks.filter(x=>x.id!==k);t.taskNote=`已把「${task.name}」转给 ${atmName(to)}：之后用 ${atmName(to)} 的身份发送，计划和内容不变。`;atmSettle(t);atmRender();return;}
 const gc=e.target.dataset.groupCheck,ed=e.target.closest('[data-editor]');if(gc&&ed){const t=atmTeam(ed.dataset.editor);t.removedNote='';if(e.target.checked){if((t.pendingRemove??[]).includes(gc))t.pendingRemove=t.pendingRemove.filter(g=>g!==gc);else t.groups=[...new Set([...t.groups,gc])];}else if(t.groups.includes(gc)&&t.id!=='draft')t.pendingRemove=[...new Set([...(t.pendingRemove??[]),gc])];else t.groups=t.groups.filter(g=>g!==gc);atmMarkDirty(t.id);atmRender();}
});
atmEl('atm-new').addEventListener('click',()=>{if(!atmTeam('draft'))atm.teams.push({id:'draft',name:'',team:'',tone:'var(--acv-ink)',app:'',mode:'qr',status:'onboarding',groups:[],duty:'',prompt:'',profiles:[{name:'能力档 1',prompt:'',tools:['files.read'],mcps:[],skills:[]}],onboard:[],active:0});atmSelected='draft';atmStage='scan';atmApplyStage();atmMcpPick=null;atmDelete=null;atmRender();});
atmRender();
</script>
<script>
  // Cross-prototype navigation: inside the gallery ask the parent page to switch; when opened alone, go to the file directly
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
