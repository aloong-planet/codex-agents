<div class="acv2-app" data-shared-block="agent-console">
<header class="acv2-header"><div class="acv2-brand">Agent 工作台 <small>工作空间 / 关系与记录</small></div><div class="acv2-local"><span class="acv2-dot"></span>本机工作空间</div></header>
<main class="acv2-main">

· 树上只显示进行中和待确认的执行者，同一事务的执行者放在一个虚线框里。
· 点名字、卡片或框标题查看关联记录；点名字旁的气泡与负责人私聊。"></span></div><div class="ats-heading-actions"><button class="acv2-button" type="button" data-goto="agent-console/team-management" data-goto-href="../agent-console/prototype-team-management.html">团队管理</button><button class="acv2-button acv2-primary" id="ats-all">全部记录 · 6</button></div></div>
<div class="ats-entry-bar"><span class="ats-entry-label">消息入口</span><button class="ats-chip" data-scope="group" aria-pressed="true">银河护卫队 · 群协作</button><button class="ats-chip" data-scope="private" aria-pressed="false">我的私人任务</button><span class="ats-entry-note">群与私人任务分别展示</span></div>
<div class="acv2-workspace" id="ats-workspace"><div class="ats-view" id="ats-view"></div>
<aside class="acv2-drawer" id="ats-drawer" aria-label="团队与执行记录" hidden>
<div class="acv2-drawer-head"><div><div class="acv2-eyebrow" id="ats-drawer-kind">团队</div><h2 id="ats-drawer-title">Alice</h2></div><div class="acv2-drawer-actions"><button class="acv2-button" id="ats-mode-button" type="button" hidden>私聊</button><button class="acv3-icon-close" id="ats-close" type="button" aria-label="关闭抽屉"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></div>
<div class="acv3-tabs" id="ats-record-tabs" role="tablist" aria-label="节点详情"><button class="acv3-tab" id="ats-tab-records" role="tab" aria-selected="true" aria-controls="ats-panel-records" tabindex="0">关联记录</button><button class="acv3-tab" id="ats-tab-storage" role="tab" aria-selected="false" aria-controls="ats-panel-storage" tabindex="-1">关系与存储</button></div>

<div class="acv2-drawer-foot" id="ats-record-foot">事务结果与发送状态分别记录；平台接收不代表用户已阅读。</div>
</aside><div class="acv2-mask"></div></div>
</main></div>
<div data-demo-harness><span class="dh-tag">Demo ·</span><div class="dh-group"><span class="dh-title">本机登录</span><div class="dh-opts"><button type="button" class="dh-opt" data-acv-auth="ok" aria-pressed="true">已授权</button><button type="button" class="dh-opt" data-acv-auth="none" aria-pressed="false">未登录</button><button type="button" class="dh-opt" data-acv-auth="expired" aria-pressed="false">链接已失效</button></div></div><div class="dh-group"><span class="dh-title">Jack 团队</span><div class="dh-opts"><button type="button" class="dh-opt" data-deleting="" aria-pressed="true">正常</button><button type="button" class="dh-opt" data-deleting="jack" aria-pressed="false">删除中</button></div></div><div class="dh-group dh-actions"><span class="dh-title">演示</span><div class="dh-acts"><button class="dh-act" data-complete-task disabled>完成当前分工</button><button class="dh-act" data-reset-chat>重置对话与事务</button></div></div><p class="dh-note">对话、分派和汇报均为模拟。选中执行中的分工（执行者节点、展开的事务记录或私聊里关联的事务）后，可模拟完成这一项；真实产品由执行结果更新状态，无此完成按钮。刷新清空演示数据。</p><p class="dh-note">Jack 团队：产品里由团队管理页的删除操作决定，app 内无此切换。</p><p class="dh-note">本机登录：产品里由浏览器是否持有有效授权决定，app 内无此切换。</p></div>

 atsRender();if(atsMode==='chat')atsRenderChat();else{atsRenderDrawerRows();atsEl('ats-panel-storage').innerHTML=atsRelation(atsSelected);}atsDemoState();}
function atsChangeScope(scope){if(!['group','private'].includes(scope))return;atsViewScope=scope;atsClose();atsRender();}
document.addEventListener('click',e=>{
 if(e.target.closest('[data-reset-chat]')){atsRequests.splice(0,atsRequests.length,...JSON.parse(JSON.stringify(atsInitialRequests)));atsChats.clear();atsNextTask=2404;atsDeleting=null;document.querySelectorAll('[data-deleting]').forEach(b=>b.setAttribute('aria-pressed',String(!b.dataset.deleting)));atsExpanded={alice:true,bill:true,jack:true};atsViewScope='group';atsClose();atsRender();return;}
 if(e.target.closest('[data-complete-task]')){atsCompleteTask();return;}
 const del=e.target.closest('[data-deleting]');if(del){atsDeleting=del.dataset.deleting||null;document.querySelectorAll('[data-deleting]').forEach(b=>b.setAttribute('aria-pressed',String(b===del)));atsRender();if(!atsEl('ats-drawer').hidden&&atsMode==='chat')atsRenderChat();return;}
 const plan=e.target.closest('[data-plan]');if(plan){atsPlanAct(plan.dataset.plan);return;}
 const ctl=e.target.closest('[data-ctl]');if(ctl){atsChatState(atsChatRole).ctl=ctl.dataset.ctl;atsRenderChat();return;}
 if(e.target.closest('[data-ctl-back]')){atsChatState(atsChatRole).ctl=null;atsRenderChat();return;}
 const ok=e.target.closest('[data-ctl-ok]');if(ok){const state=atsChatState(atsChatRole),r=atsFindRequest(state.taskId);if(r&&r.requester==='owner'&&r.scope==='private'){if(ok.dataset.ctlOk==='cancel'&&atsActive(r.status))atsCancelRequest(r,state);else if(ok.dataset.ctlOk==='retry')atsRetryRequest(r,state);}return;}
 const scope=e.target.closest('[data-scope]');if(scope){atsChangeScope(scope.dataset.scope);return;}
 const chat=e.target.closest('[data-chat]');if(chat){atsOpenChat(chat.dataset.chat,chat.dataset.chatTask,chat);return;}
 if(e.target.closest('[data-create-private]')){atsCreatePrivate();return;}
 if(e.target.closest('[data-dismiss-private]')){atsChatState(atsChatRole).newTask=null;atsRenderChat();return;}
 if(e.target.closest('[data-confirm-chat]')){atsConfirmChat();return;}
 if(e.target.closest('[data-supplement-chat]')){atsEl('ats-chat-input').focus();return;}
 const toggle=e.target.closest('[data-toggle]');if(toggle){atsExpanded[toggle.dataset.toggle]=!atsExpanded[toggle.dataset.toggle];atsRender();return;}
 const zoom=e.target.closest('[data-zoom]');if(zoom){if(zoom.dataset.zoom==='fit'){atsFitMode=true;atsFit();}else{atsFitMode=false;atsScale=Math.max(.5,Math.min(1.4,atsScale+(zoom.dataset.zoom==='in'?.1:-.1)));atsApplyScale();}return;}
 const open=e.target.closest('[data-open]');if(open){atsOpen(open.dataset.open,open);return;}
 const job=e.target.closest('[data-job]');if(job){const id=job.dataset.job;atsExpandedJob=atsExpandedJob===id?null:id;atsRenderDrawerRows();return;}
 if(!atsEl('ats-drawer').hidden&&!e.target.closest('#ats-drawer,button,input,select,textarea,a,summary,[role="button"],[data-demo-harness]'))atsClose();
});
atsEl('ats-all').addEventListener('click',e=>atsOpen(null,e.currentTarget));atsEl('ats-close').addEventListener('click',atsClose);
atsEl('ats-mode-button').addEventListener('click',e=>{if(atsMode==='chat'){const r=atsFindRequest(atsChatState(atsChatRole).taskId);if(r){atsViewScope=r.scope;atsRender();}atsOpen(atsChatRole,e.currentTarget);}else atsOpenChat(atsSelected,null,e.currentTarget);});
for(const key of ['records','storage'])atsEl('ats-tab-'+key).addEventListener('click',()=>atsSetTab(key));
document.querySelector('.acv3-tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();atsSetTab(e.key==='Home'?'records':e.key==='End'?'storage':atsTab==='records'?'storage':'records',true);});
for(const id of ['ats-search','ats-status','ats-delivery'])atsEl(id).addEventListener(id==='ats-search'?'input':'change',()=>{atsExpandedJob=null;atsRenderDrawerRows();});
atsEl('ats-chat-pane').addEventListener('input',e=>{if(e.target.id==='ats-chat-input'){atsChatState(atsChatRole).draft=e.target.value;atsEl('ats-chat-send').disabled=!e.target.value.trim();}});
atsEl('ats-chat-pane').addEventListener('change',e=>{if(e.target.id==='ats-chat-task'){const state=atsChatState(atsChatRole),r=atsOwnJobs(atsChatRole).find(x=>x.id===e.target.value);state.taskId=r?.id??'';state.proposal=atsDefaultProposal(r);state.newTask=null;state.ctl=null;atsRenderChat();}if(e.target.id==='ats-new-task-team'){atsChatState(atsChatRole).newTask.team=e.target.value;atsRenderChat();}});
atsEl('ats-chat-pane').addEventListener('submit',e=>{e.preventDefault();atsSendChat();});
atsEl('ats-chat-pane').addEventListener('keydown',e=>{if(e.target.id==='ats-chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();atsSendChat();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!atsEl('ats-drawer').hidden){e.preventDefault();atsClose();}});
new ResizeObserver(()=>{atsFit();atsResponsive();}).observe(atsEl('ats-view'));
history.replaceState(null,'','#tree');atsRender();
</script>
<script>
  // Cross-prototype navigation: inside the gallery ask the parent page to switch; when opened alone, go to the file directly
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
