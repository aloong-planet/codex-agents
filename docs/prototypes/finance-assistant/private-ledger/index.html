<!doctype html>
<!-- Logic prototype page template (the canonical copy lives in the prototype skill; after copying, replace the {{...}} placeholders).
     Diagram source: the *.mmd files in the same directory (canonical) → sync-mmd.mjs derives model.mmd.js → this page renders it.
     Panel rules and implementation constraints are in STATE-MACHINE.md; do not change the CSS and script mechanics (measured: aria-disabled / no opacity / data-tip). -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Prototype — Penny · 私聊记账</title>
<style>
  :root{
    --bg:#f7f8f9; --card:#ffffff; --text:#37352f; --text-2:#787774;
    --line:#e8eaed; --line-strong:#d9dce0; --accent:#8a67ab; --accent-soft:#f0ebf6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#18191b; --card:#1f2124; --text:#e6e6e5; --text-2:#9b9a97;
      --line:#2a2c30; --line-strong:#34373c; --accent:#a084c7; --accent-soft:#2c2733; }
  }
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:var(--bg);color:var(--text);font-size:13px;padding:28px;max-width:860px;margin:0 auto}
  h1{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .tag{font-size:10px;border:1px solid var(--line-strong);border-radius:4px;padding:1px 6px;color:var(--text-2)}
  .q{color:var(--text-2);line-height:1.7;margin-bottom:18px}
  h4{font-size:12px;color:var(--text-2);margin:18px 0 8px}
  .dg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
  .dg pre{font-size:12px;white-space:pre-wrap}
  .dg.pan{height:56vh;padding:0;overflow:hidden;position:relative;cursor:grab;touch-action:none;user-select:none;background:#fdfdfd}
  .dg.pan.dragging{cursor:grabbing}
  .dg.pan svg{display:block;transform-origin:0 0;will-change:transform;overflow:visible}
  /* With htmlLabels:false, mermaid puts a rect.background under every edge label, and its stylesheet sets the fill to primaryColor (#ECECFF, pale purple);
     the edgeLabelBackground variable does not reach it, and mermaid's styles have high specificity, so !important is needed to make it transparent (confirmed in Chrome) */
  .dg svg .edgeLabel rect.background{fill:transparent !important}
  /* Edge labels one size smaller than node text (nodes default to 16px), so the state nodes stand out as the main subject */
  .dg svg .edgeLabel text,.dg svg .edgeLabel tspan{font-size:14px}
  .rst{position:absolute;top:8px;right:8px;z-index:2;border:1px solid var(--line-strong);
    background:var(--card);color:var(--text-2);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
  .rst:hover{color:var(--accent);border-color:var(--accent)}
  code{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-size:12px;user-select:all;overflow-x:auto;white-space:pre}
  .hint{font-size:12px;color:var(--text-2);margin-top:14px}

  /* ── Driving panel ── */
  .drive{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .st{display:flex;flex-direction:column;gap:9px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .st-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .st-row .k{width:96px;color:var(--text-2);font-family:ui-monospace,Menlo,monospace;font-size:12px;flex:none}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:600;
    padding:2px 10px;border-radius:5px;border:1px solid transparent}
  .badge.pending{background:#fff6b8;border-color:#e4c800;color:#5c5100}
  .badge.accepted{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
  .badge.done{background:#dcfce7;border-color:#86efac;color:#166534}
  .badge.failed,.badge.rejected{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
  .badge.expired{background:var(--line);border-color:var(--line-strong);color:var(--text-2)}
  .badge.empty{background:transparent;border-color:var(--line-strong);color:var(--text-2);border-style:dashed}
  .bar{width:170px;height:7px;border-radius:4px;background:var(--line);overflow:hidden;flex:none}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s}
  .num{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .val{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .val.nil{color:var(--text-2);opacity:.7}
  .illegal{margin:12px 0;padding:8px 12px;border-radius:7px;font-size:12.5px;border:1px solid}
  .illegal.ok{color:var(--text-2);border-color:var(--line);background:transparent}
  .illegal.idle{color:var(--text-2);border-color:var(--line);background:transparent;opacity:.6}
  .illegal .ev{font-family:ui-monospace,Menlo,monospace;color:var(--accent);font-weight:600}
  .illegal.bad{color:#991b1b;border-color:#fca5a5;background:#fee2e2}
  @media (prefers-color-scheme:dark){
    .illegal.bad{color:#fca5a5;border-color:#7f1d1d;background:#2a1416}
    .badge.pending{background:#3a3316;border-color:#7a6a1e;color:#f0dd8a}
    .badge.accepted{background:#17263f;border-color:#2c4d80;color:#93c5fd}
    .badge.done{background:#12301d;border-color:#2a6540;color:#86efac}
    .badge.failed,.badge.rejected{background:#2a1416;border-color:#7f1d1d;color:#fca5a5}
  }
  .acts{display:flex;flex-direction:column;gap:10px}
  .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .grp-t{font-size:11px;color:var(--text-2);width:78px;flex:none;
    font-family:ui-monospace,Menlo,monospace}
  .acts button{font:inherit;font-size:12.5px;padding:5px 13px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--bg);color:var(--text);transition:.12s}
  .acts button:hover{border-color:var(--accent);color:var(--accent)}
  .acts button:active{transform:translateY(1px)}
  .acts button.ghost{border-style:dashed;color:var(--text-2);margin-left:4px}
  .acts button.ghost:hover{border-style:solid;color:var(--accent)}
  /* Greyed out = unreachable from the current state (derived from legal(state), not judged by the UI itself) */
  /* Greying out does not use opacity: opacity would also fade the pseudo-element tooltip and make its text unreadable. Use specific faded colours instead. */
  .acts button[aria-disabled="true"]{cursor:not-allowed;border-style:dotted;
    color:var(--text-2);opacity:1;border-color:var(--line);background:transparent}
  .acts button[aria-disabled="true"]:hover{border-color:var(--line-strong);color:var(--text-2)}
  /* Instant tooltip: the native title has a delay of about 1 s, and the reason for greying out must be visible at once */
  .acts button{position:relative}
  .acts button[data-tip]:hover::after{
    content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
    background:#1b1b1f;color:#fff;font-size:11.5px;line-height:1.45;padding:6px 10px;border-radius:6px;
    white-space:nowrap;z-index:20;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.28)}
  .acts button[data-tip]:hover::before{
    content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#1b1b1f;z-index:20;pointer-events:none}
  .stress{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--text-2);cursor:pointer}
  .stress input{cursor:pointer}
  code.inl{display:inline;background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-size:11.5px}
  .drive .hint{margin-top:14px;line-height:1.6}
  /* Highlight the current state's node on the diagram */
  .dg svg g.node.cur rect,.dg svg g.node.cur polygon,.dg svg g.node.cur circle{
    stroke:var(--accent) !important;stroke-width:2.5px !important}
  .messages{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);padding:18px;border-radius:10px;min-height:120px}
  .message{max-width:92%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;line-height:1.65;white-space:pre-wrap}
  .message.owner{align-self:flex-end;background:var(--accent-soft)}
  .speaker{display:block;font-size:11px;color:var(--text-2);margin-bottom:4px}
  .summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .summary article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;line-height:1.8}
  .summary strong{display:block;margin-bottom:6px}.summary .num{color:var(--text)}
  @media(max-width:560px){body{padding:16px}.summary{grid-template-columns:1fr}.grp-t{width:100%}.message{max-width:100%}}
</style>
<script src="../../manifest.js"></script>
<script src="../../app-identity.js"></script>
</head>
<body>
  <h1>Penny · 私聊记账 <span class="tag">Logic</span></h1>
  <div class="q">验证问题：文字直接入账、文件和截图先确认、纠错后重算，是否符合你的使用习惯？<br>这是一份本地演示，全部金额均为虚构；不会发送飞书消息、读取支付账户或写入真实账本。每次切换场景都会恢复同一份演示账本。</div>
  <h4>私聊消息预览</h4><div id="messages" class="messages" aria-live="polite"></div>
  <h4>本月已入账汇总 · 演示数据</h4><div id="summary" class="summary"></div>

  <h4>选择场景，再点击下方动作体验流程</h4>
  <div class="drive">
    <div class="st">
      <div class="st-row"><span class="k">请求状态</span><span id="v-status" class="badge">—</span></div>
      <div class="st-row"><span class="k">完成情况</span>
        <span class="bar"><i id="v-bar"></i></span><span id="v-prog" class="num">0 / 0</span></div>
      <!-- Scenario fields reflect the model, not a live service. -->
      <div class="st-row"><span class="k">目标账本</span><span id="v-path" class="val nil">—</span></div>
      <div class="st-row"><span class="k">本次来源</span><span id="v-err" class="val nil">—</span></div>
    </div>
    <div id="v-illegal" class="illegal idle">No event dispatched yet</div>
    <div class="acts">
      <div class="grp"><span class="grp-t">演示场景</span>
        <button data-new="text">文字记账</button><button data-new="file">导入账单</button><button data-new="screenshot">模糊截图</button>
        <button data-new="correct">更正金额</button><button data-new="void">撤销记录</button><button data-new="summary">查询月结</button>
        <button data-new="private_boundary">私聊边界</button><button id="btn-reset" class="ghost">清空演示</button>
      </div>
      <div class="grp"><span class="grp-t">入账操作</span>
        <button data-act="post">完成文字记账</button><button data-act="fill_amount">补充金额 39.90 元</button>
        <button data-act="confirm">确认当前预览</button><button data-act="cancel">取消本次请求</button>
      </div>
      <div class="grp"><span class="grp-t">预览账本</span>
        <button data-act="choose_personal">改为个人账</button><button data-act="choose_business">改为经营账</button>
      </div>
      <div class="grp"><span class="grp-t">边界验证</span>
        <button data-act="duplicate_delivery">重复收到同一消息</button><button data-act="foreign_sender">其他人确认</button>
      </div>
    </div>
    <label class="stress"><input type="checkbox" id="stress"><span>边界演示：允许点击不可用动作，检查它是否被拒绝</span></label>
    <p class="hint">灰色动作当前不可用，悬停可查看原因。预览中的收支尚未进入下方汇总；确认后才能计入。</p>
  </div>

<h4>状态与边界模型</h4><div id="dgs"></div>
<script src="../../vendor/mermaid.min.js"></script>
<script src="./model.mmd.js"></script>
<script src="./logic.js"></script>
<script>
  const host = document.getElementById('dgs');
  const packs = Object.values(window.MERMAID_SOURCES || {}).flat();
  (async () => {
    if (!packs.length) { host.innerHTML = '<div class="hint">No diagram source: the directory has no .mmd, or sync-mmd.mjs has not been run.</div>'; return; }
    let i = 0;
    for (const d of packs) {
      const h = document.createElement('h4'); h.textContent = d.title;
      const box = document.createElement('div'); box.className = 'dg';
      host.appendChild(h); host.appendChild(box);
      if (!window.mermaid) {
        const pre = document.createElement('pre'); pre.textContent = d.src; box.appendChild(pre);
        continue; // vendor library missing: fall back to showing the diagram source text
      }
      try {
        // The built-in dark theme is nearly greyscale and default is designed for light backgrounds — use base + themeVariables to take the project palette
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'base',
          themeVariables: dark ? {
            primaryColor: '#2c2733', primaryTextColor: '#e6e6e5', primaryBorderColor: '#a084c7',
            lineColor: '#9b9a97', textColor: '#e6e6e5', edgeLabelBackground: '#1f2124',
            noteBkgColor: '#34373c', noteTextColor: '#e6e6e5', background: '#18191b',
            secondaryColor: '#1f2124', tertiaryColor: '#232526'
          } : {
            primaryColor: '#f0ebf6', primaryTextColor: '#37352f', primaryBorderColor: '#8a67ab',
            lineColor: '#787774', textColor: '#37352f', edgeLabelBackground: '#ffffff',
            noteBkgColor: '#f7f8f9', noteTextColor: '#37352f', background: '#ffffff',
            secondaryColor: '#ffffff', tertiaryColor: '#f7f8f9'
          } });
        const { svg } = await mermaid.render('mmd-' + i++, d.src);
        box.innerHTML = svg;
        enablePanZoom(box);
      } catch (e) {
        const pre = document.createElement('pre'); pre.textContent = d.src; box.appendChild(pre);
      }
    }
  })();

  // Canvas interaction: drag = pan; pinch or ⌘/Ctrl + wheel = smooth zoom (anchored at the pointer); a plain wheel scrolls the page; double-click or ⌂ = reset to fit
  function enablePanZoom(box){
    const svg = box.querySelector('svg');
    if (!svg || !svg.viewBox || !svg.viewBox.baseVal.width) return;
    const natW = svg.viewBox.baseVal.width, natH = svg.viewBox.baseVal.height;
    svg.style.maxWidth = 'none'; svg.style.width = natW + 'px'; svg.style.height = natH + 'px';
    box.classList.add('pan');
    box.insertAdjacentHTML('beforeend', '<button class="rst" title="Reset view (same as double-clicking the canvas)">⌂</button>');
    let s = 1, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0;
    const apply = () => { svg.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
    const fit = () => {
      const r = box.getBoundingClientRect();
      s = Math.min((r.width - 28) / natW, (r.height - 28) / natH, 1);
      tx = (r.width - natW * s) / 2; ty = (r.height - natH * s) / 2; apply();
    };
    fit();
    box.querySelector('.rst').addEventListener('click', (e) => { e.stopPropagation(); fit(); });
    box.addEventListener('dblclick', fit);
    box.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.rst')) return;
      dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
      box.classList.add('dragging'); box.setPointerCapture(e.pointerId);
    });
    box.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      tx = e.clientX - sx; ty = e.clientY - sy; apply();
    });
    const end = () => { dragging = false; box.classList.remove('dragging'); };
    box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
    box.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return; // a plain scroll is not hijacked; the page scrolls normally
      e.preventDefault();
      let dy = e.deltaY;
      if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 120; // normalise line/page modes to pixels
      dy = Math.max(-60, Math.min(60, dy)); // cap a single step: one mouse notch ≈ ±12%
      const r = box.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const ns = Math.min(5, Math.max(0.2, s * Math.exp(-dy * 0.002)));
      tx = px - (px - tx) * (ns / s); ty = py - (py - ty) * (ns / s); s = ns; apply();
    }, { passive: false });
  }
</script>

<script>
(function () {
  const SM = window.StateMachine;
  let state = null;
  let lastEvent = null;
  const byId = id => document.getElementById(id);
  function highlight() {
    document.querySelectorAll('.dg svg g.node').forEach(node => node.classList.toggle('cur', state !== null && (node.textContent || '').trim() === state.status));
  }
  function render() {
    byId('v-status').textContent = state ? SM.STATUS_NAMES[state.status] : '—';
    const shade = !state ? 'empty' : SM.TERMINAL.has(state.status) ? state.status === 'committed' ? 'done' : state.status === 'rejected' ? 'rejected' : 'expired' : 'pending';
    byId('v-status').className = 'badge ' + shade;
    byId('v-bar').style.width = state?.received ? '100%' : '0%';
    byId('v-prog').textContent = state ? `${state.received} / ${state.total}` : '0 / 0';
    byId('v-path').textContent = state ? state.book ? SM.bookName(state.book) : 'null' : '—';
    byId('v-err').textContent = state?.mode ?? '—';
    byId('v-illegal').textContent = state?.illegal || (lastEvent ? `${lastEvent} → ${SM.STATUS_NAMES[state.status]}` : '尚未执行动作');
    byId('v-illegal').className = 'illegal ' + (state?.illegal ? 'bad' : lastEvent ? 'ok' : 'idle');
    byId('messages').replaceChildren();
    for (const message of state?.messages ?? [{ who: '演示说明', text: '请选择“文字记账”等场景，查看 Penny 的私聊流程。' }]) {
      const row = document.createElement('div'); row.className = 'message' + (message.who === '你' ? ' owner' : '');
      const name = document.createElement('span'); name.className = 'speaker'; name.textContent = message.who;
      row.append(name, document.createTextNode(message.text)); byId('messages').append(row);
    }
    byId('summary').replaceChildren();
    if (state && state.book !== null) for (const book of ['personal', 'business']) {
      const sums = SM.totals(state.entries, book); const card = document.createElement('article');
      const title = document.createElement('strong'); title.textContent = SM.bookName(book); card.append(title);
      for (const [label, value] of [['收入', sums.income], ['支出', sums.expense], ['结余', sums.net]]) {
        const line = document.createElement('div'); line.textContent = `${label}：¥${SM.money(value)}`; card.append(line);
      }
      const count = document.createElement('div'); count.textContent = `${sums.count} 笔有效记录`; card.append(count); byId('summary').append(card);
    }
    else byId('summary').textContent = state ? '未读取账本。' : '选择场景后显示虚构账本。';
    const permissions = SM.legal(state); const stress = byId('stress').checked;
    document.querySelectorAll('[data-act]').forEach(button => {
      const permission = permissions[button.dataset.act];
      button.setAttribute('aria-disabled', String(!permission.legal && !(stress && state)));
      if (permission.legal) button.removeAttribute('data-tip'); else button.dataset.tip = permission.why;
    });
    highlight();
  }
  document.querySelectorAll('[data-new]').forEach(button => button.addEventListener('click', () => { state = SM.initial(button.dataset.new); lastEvent = null; render(); }));
  document.querySelectorAll('[data-act]').forEach(button => button.addEventListener('click', () => {
    if (button.getAttribute('aria-disabled') === 'true') return;
    lastEvent = button.textContent; state = SM.reduce(state, { type: button.dataset.act }); render();
  }));
  byId('btn-reset').addEventListener('click', () => { state = null; lastEvent = null; render(); });
  byId('stress').addEventListener('change', render);
  new MutationObserver(highlight).observe(byId('dgs'), { childList: true, subtree: true });
  render();
})();
</script>
</body>
</html>
